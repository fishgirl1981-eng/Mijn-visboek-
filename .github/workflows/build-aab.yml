
name: Build Mijn Visboek AAB

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Download upload key
        uses: actions/download-artifact@v4
        with:
          name: mijn-visboek-upload-key
          path: signing
          repository: fishgirl1981-eng/Mijn-visboek-
          run-id: 45480900897
          github-token: ${{ github.token }}

      - name: Configure signing
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          cp ../signing/mijn-visboek-upload.jks upload-keystore.jks
          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("upload-keystore.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias "mijnvisboek"
                      keyPassword System.getenv("STORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed AAB
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Verify signature
        run: |
          jarsigner -verify -verbose -certs \
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Mijn-Visboek-AAB-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          
